<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动态记忆工作台</title><style>body{font:15px system-ui;margin:0;background:#f3f5f8;color:#19263b}header{background:#162f4b;color:white;padding:22px 5%}main{max-width:1200px;margin:24px auto;padding:0 20px}.panel{background:white;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 3px 18px #1122330c}select,input,button{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:6px}input{width:min(600px,65%)}button{background:#2463a5;color:white;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#536779}article{border-top:1px solid #e2e8f0;padding:12px 0;line-height:1.55}.tag{background:#edf4fb;border-radius:4px;padding:3px 6px}.error{color:#b42318}pre{white-space:pre-wrap;overflow-wrap:anywhere}details{margin:8px 0}</style></head><body><header><h1>动态记忆工作台</h1><div>LoCoMo · 检索、状态解析与原始证据</div></header><main><section class="panel"><div class="row"><label>对话 <select id="sample"></select></label><button id="load">查看记忆</button><button id="export">导出 JSON</button><span id="count" class="muted"></span></div><p class="muted">数据划分为本项目自行设定；时间为原始对话记录的本地时间，未指定时区。</p><div class="row"><input id="import-file" type="file" accept=".json,application/json" style="width:auto"><button id="import">导入 LoCoMo JSON</button><span id="import-status" class="muted"></span></div></section><section class="panel"><h2>问题与状态分析</h2><div class="row"><input id="question" placeholder="输入问题，或选择数据集中的问题"><select id="method"><option value="dynamic">动态状态分析</option><option value="vector">向量检索基线</option><option value="hybrid">混合检索基线（无状态分析）</option><option value="full">全文基线</option></select><input id="asof" placeholder="截至日期 YYYY-MM-DD" style="width:180px"><button id="ask">分析</button><button id="export-result" disabled>导出本次分析</button></div><p><select id="questions"><option value="">选择示例问题</option></select></p><div id="status" class="muted"></div><div id="result"></div></section><section class="panel"><h2>结构化记忆与原始证据</h2><input id="filter" placeholder="筛选内容、人物或轮次"><div id="list"></div></section><section class="panel"><h2>Graphiti 图谱示例</h2><p class="muted">仅包含 conv-26 的 D2:8、D13:1、D19:1 三轮历史数据；图谱未覆盖完整对话。原始示例将无时区的会话时间按 UTC 保存，不能视为已证实的时区。</p><button id="graph">读取示例图谱</button><div id="graphresult"></div></section></main><script>
const $=id=>document.getElementById(id); let memories=[],lastResult=null; const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); async function get(url){let r=await fetch(url),d=await r.json();if(!r.ok)throw Error(d.error);return d} function render(){let q=$('filter').value.toLowerCase(), m=memories.filter(x=>JSON.stringify(x).toLowerCase().includes(q)); $('count').textContent=`${memories.length} 条记忆`; $('list').innerHTML=m.slice(0,200).map(x=>`<article><span class="tag">${esc(x.source.turn)}</span> <b>${esc(x.entity)}</b> · ${esc(x.timestamp)}<p>${esc(x.content)}</p>${x.resolved_time_expressions.length?`<p class="muted">推算日期（仅供核对）：${x.resolved_time_expressions.map(t=>`${esc(t.expression)} → ${esc(t.date)}`).join("；")}</p>`:""}<details><summary>抽取事实（机器生成，需核对）</summary><pre>${esc(x.facts===null?'尚未抽取':JSON.stringify(x.facts,null,2))}</pre></details><details><summary>数据集自带观察标注（${x.dataset_observations.length}）</summary><pre>${esc(JSON.stringify(x.dataset_observations,null,2))}</pre></details><details><summary>原始证据</summary><pre>${esc(JSON.stringify(x.evidence,null,2))}</pre></details></article>`).join('')+(m.length>200?'<p>仅展示前 200 条，请筛选或导出 JSON。</p>':'')}
async function load(){lastResult=null;$('export-result').disabled=true;try{let id=encodeURIComponent($('sample').value);[memories,qs]=await Promise.all([get('/api/memories?sample='+id),get('/api/questions?sample='+id)]);$('questions').innerHTML='<option value="">选择示例问题</option>'+qs.map(x=>`<option value="${esc(x.question)}">${esc(x.question)}</option>`).join('');render()}catch(e){$('status').textContent=e.message}} let qs=[]; $('load').onclick=load;$('sample').onchange=load;$('filter').oninput=render;$('questions').onchange=()=>$('question').value=$('questions').value;$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(memories,null,2)],{type:'application/json'}));a.download=$('sample').value+'-memories.json';a.click();URL.revokeObjectURL(a.href)};
async function refreshSamples(selected){let samples=await get('/api/samples');$('sample').innerHTML=samples.map(x=>`<option value="${esc(x.id)}">${esc(x.id)} · ${esc(x.split)}</option>`).join('');if(selected)$('sample').value=selected;await load()}
$('import').onclick=async()=>{let file=$('import-file').files[0],b=$('import');if(!file){$('import-status').textContent='请先选择 JSON 文件';return}b.disabled=true;$('import-status').textContent='正在导入…';try{if(file.size>20000000)throw Error('文件不能超过 20 MB');let payload=JSON.parse(await file.text());let r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(d.error);await refreshSamples(d.imported[0]);$('import-status').textContent=`已导入 ${d.imported.length} 段对话`; $('import-file').value=''}catch(e){$('import-status').textContent='导入失败：'+e.message}finally{b.disabled=false}};
$('graph').onclick=async()=>{let box=$('graphresult');box.textContent='正在读取本地图谱…';try{let d=await get('/api/graphiti-demo');box.innerHTML=`<p>已导入 ${d.episodes.length} 轮，提取 ${d.facts.length} 条图谱事实。没有生成关系的原始轮次仍列在下方。</p>`+d.facts.map(f=>`<article><b>${esc(f.fact)}</b><p>Graphiti 有效时间（未核验）：${esc(f.valid_at||'未知')} · 失效时间：${esc(f.invalid_at||'未标记')}</p>${f.sources.map(x=>`<p><span class="tag">${esc(x.turn)}</span> ${esc(x.original?.content||'原始轮次未找到')}</p>`).join('')}</article>`).join('')+'<details><summary>全部导入轮次</summary>'+d.episodes.map(x=>`<p>${esc(x.turn)}：${esc(x.original?.content||'原始轮次未找到')}</p>`).join('')+'</details>'}catch(e){box.innerHTML='<span class="error">'+esc(e.message)+'</span>'}};
$('export-result').onclick=()=>{if(!lastResult)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(lastResult,null,2)],{type:'application/json'}));a.download=$('sample').value+'-analysis.json';a.click();URL.revokeObjectURL(a.href)};
$('ask').onclick=async()=>{let b=$('ask');b.disabled=true;lastResult=null;$('export-result').disabled=true;$('status').textContent='正在检索并调用本地模型，首次向量索引可能需要较长时间…';$('result').innerHTML='';try{let r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sample:$('sample').value,question:$('question').value,method:$('method').value,as_of:$('asof').value})}),d=await r.json();if(!r.ok)throw Error(d.error);lastResult=d;$('export-result').disabled=false;$('status').textContent=`模型：${d.model} · 检索 ${d.retrieved.length} 条`;let states=Object.fromEntries(d.memories.map(x=>[x.id,x]));$('result').innerHTML=`<h3>回答</h3><p>${esc(d.answer)}</p><h3>状态关系</h3><p class="muted">模型生成的状态和理由可能有误，请核对对应原始发言及日期。</p>${d.relations.map(x=>`<article>${esc(x.from_id)} → ${esc(x.to_id)} <b>${esc(x.type)}</b><br>${esc(x.reason)}</article>`).join('')||'<p>未返回关系。</p>'}${d.rejected_relations?.length?`<details><summary>模型复核未通过的关系（${d.rejected_relations.length}）</summary>${d.rejected_relations.map(x=>`<article>${esc(x.from_id)} → ${esc(x.to_id)} ${esc(x.type)}<br>原判断：${esc(x.reason)}<br>复核：${esc(x.review_reason)}</article>`).join('')}</details>`:''}<h3>相关历史记忆</h3>`+d.retrieved.map(x=>`<article><span class="tag">${esc(x.source.turn)}</span> <b>${esc(x.entity)}</b> · ${esc(x.timestamp)} · ${esc(states[x.memory_id]?.state||'未判断')}<p>${esc(x.content)}</p><small>${esc(states[x.memory_id]?.reason||'')}</small></article>`).join('')}catch(e){$('status').innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{b.disabled=false}}; (async()=>{try{await refreshSamples()}catch(e){$('status').textContent=e.message}})();
</script></body></html>
