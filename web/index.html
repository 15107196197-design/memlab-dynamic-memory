<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动态记忆工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/v2.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="#/home">动态记忆工作台</a>
      <nav class="tabs" id="tabs">
        <a href="#/home" data-view="home">首页</a>
        <a href="#/memories" data-view="memories">记忆库</a>
        <a href="#/ask2" data-view="ask2">提问与状态</a>
        <a href="#/lab" data-view="lab">实验台</a>
        <a href="#/graph2" data-view="graph2">图谱 Graph</a>
        <a href="#/evaluation2" data-view="evaluation2">评测对照</a>
        <a href="#/system" data-view="system">系统</a>
        <details class="legacy-menu"><summary>旧版</summary><div class="legacy-links">
          <a href="#/conversation">对话记忆</a>
          <a href="#/changes">变化追踪</a>
          <a href="#/graph">关系图</a>
          <a href="#/ask">旧提问</a>
          <a href="#/evaluation">旧评测</a>
        </div></details>
      </nav>
      <span class="grow"></span>
      <select id="sample" class="conv" title="切换对话"></select>
      <button class="icon-btn" id="open-search" title="搜索（Ctrl+K）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>搜索</button>
      <button class="icon-btn" id="more" title="导入或导出数据">数据</button>
    </div>
  </header>

  <main class="page" id="view"></main>

  <div id="overlay-root"></div>
  <script src="/v2.js"></script>
  <script src="/app.js"></script>
</body>
</html>
