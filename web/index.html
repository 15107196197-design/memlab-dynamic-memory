<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动态记忆工作台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="#/home">动态记忆工作台</a>
      <nav class="tabs" id="tabs">
        <a href="#/home" data-view="home">首页</a>
        <a href="#/conversation" data-view="conversation">对话记忆</a>
        <a href="#/changes" data-view="changes">变化追踪</a>
        <a href="#/graph" data-view="graph">关系图</a>
        <a href="#/ask" data-view="ask">提问</a>
        <a href="#/evaluation" data-view="evaluation">评测</a>
      </nav>
      <span class="grow"></span>
      <select id="sample" class="conv" title="切换对话"></select>
      <button class="icon-btn" id="open-search" title="搜索（Ctrl+K）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>搜索</button>
      <button class="icon-btn" id="more" title="导入或导出数据">数据</button>
    </div>
  </header>

  <main class="page" id="view"></main>

  <div id="overlay-root"></div>
  <script src="/app.js"></script>
</body>
</html>
